<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Le Red Velvet | Fine Dining & Cuisine</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- Google Fonts for modern typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <!-- Navigation Bar -->
    <header class="navbar">
      <div class="nav-container">
        <a href="#home" class="nav-brand">Le Red Velvet</a>
        <nav class="nav-links">
          <a href="#home">Home</a>
          <a href="#menu">Menu</a>
          <a href="#about">About</a>
          <a href="#order">Order</a>
        </nav>
      </div>
    </header>

    <main id="home">
      <!-- Section 1: Logo Section -->
      <section class="section logo-section">
        <div class="glass-card logo-card">
          <img id="main-logo" class="logo-img" src="" alt="Restaurant Logo" />
          <h1 id="restaurant-name"></h1>
          <p id="restaurant-tagline" class="tagline"></p>
        </div>
      </section>

      <!-- Section 2: Menu Gallery Carousel (3 images visible, loops 12 images in sets of 3 every 7s) -->
      <section class="section carousel-section">
        <h2 class="section-title">Visual Menu Highlights</h2>
        <div class="carousel-container glass-card">
          <div class="carousel-track" id="carousel-track">
            <!-- Dynamically populated carousel items -->
          </div>
        </div>
      </section>

      <!-- Section 3: Featured Meals Grid (3x3 Layout) -->
      <section id="menu" class="section meals-section">
        <h2 class="section-title">Featured Culinary Delights</h2>
        <div class="meals-grid" id="meals-grid">
          <!-- Dynamically populated 9 meal cards -->
        </div>
      </section>

      <!-- Section 4: About Us -->
      <section id="about" class="section about-section">
        <div class="glass-card about-card">
          <h2 class="section-title">Our Story</h2>
          <p id="about-text"></p>
        </div>
      </section>

      <!-- Section 5: WhatsApp Ordering -->
      <section id="order" class="section order-section">
        <div class="glass-card order-card">
          <h2>Order Online Directly</h2>
          <p>
            Craving our gourmet dishes? Place your instant order via WhatsApp
            chat for fast takeout or delivery.
          </p>
          <a
            id="whatsapp-btn"
            href="#"
            target="_blank"
            rel="noopener noreferrer"
            class="whatsapp-cta"
          >
            <svg
              class="whatsapp-icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 448 512"
              fill="currentColor"
            >
              <path
                d="M380.9 97.1C339 55.1 283.2 32 223.9 32c-122.4 0-222 99.6-222 222 0 39.1 10.2 77.3 29.6 111L0 480l117.7-30.9c32.4 17.7 68.9 27 106.1 27h.1c122.3 0 224.1-99.6 224.1-222 0-59.3-25.2-115-67.1-157zm-157 341.6c-33.2 0-65.7-8.9-94-25.7l-6.7-4-69.8 18.3 18.6-68.1-4.4-7c-18.5-29.4-28.2-63.3-28.2-98.2 0-101.7 82.8-184.5 184.6-184.5 49.3 0 95.6 19.2 130.4 54.1 34.8 34.9 56.2 81.2 56.1 130.5 0 101.8-84.9 184.6-186.6 184.6zm101.2-138.2c-5.5-2.8-32.8-16.2-37.9-18-5.1-1.9-8.8-2.8-12.5 2.8-3.7 5.6-14.3 18-17.6 21.8-3.2 3.7-6.5 4.2-12 1.4-32.6-16.3-54-29.1-75.5-66-5.7-9.8 5.7-9.1 16.3-30.3 1.8-3.7.9-6.9-.5-9.7-1.4-2.8-12.5-30.1-17.1-41.2-4.5-10.8-9.1-9.3-12.5-9.5-3.2-.2-6.9-.2-10.6-.2-3.7 0-9.7 1.4-14.8 6.9-5.1 5.6-19.4 19-19.4 46.3 0 27.3 19.9 53.7 22.6 57.4 2.8 3.7 39.1 59.7 94.8 83.8 35.2 15.2 49 16.5 66.6 13.9 10.7-1.6 32.8-13.4 37.4-26.4 4.6-13 4.6-24.1 3.2-26.4-1.3-2.5-5-3.9-10.5-6.6z"
              />
            </svg>
            Order via WhatsApp
          </a>
        </div>
      </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <p>&copy; <span id="year"></span> Le Red Velvet. All rights reserved.</p>
    </footer>

    <!-- Centralized Data Configuration & Script -->
    <script>

          },
          {
            url: "https://images.unsplash.com/photo-1484723091739-30a097e8f929?auto=format&fit=crop&w=600&q=80",

          },
          {

          {

        // 9 Featured Meals for the 3x3 Grid
        featuredMeals: [
          {

          },
          {

            price: "$22.00",

              "San Marzano tomato base, fresh mozzarella di bufala, prosciutto, and basil.",
            image:

          },
          {
            title: "Signature Molten Lava Cake",
            price: "$14.00",
            description:

              "https://images.unsplash.com/photo-1606313564200-e75d5e30476c?auto=format&fit=crop&w=600&q=80",
          },
          {
            title: "Berry Sparkler Cocktails",
            price: "$16.00",
            description:
              "Craft cocktail with muddled raspberries, prosecco, fresh mint, and elderflower.",
            image:
              "https://images.unsplash.com/photo-1514362545857-3bc16c4c7d1b?auto=format&fit=crop&w=600&q=80",
          },
        ],
      };

      /* ==========================================================================
       DYNAMIC POPULATION & CAROUSEL LOGIC
       ========================================================================== */
      document.addEventListener("DOMContentLoaded", () => {
        // 1. Set General Text & Logo
        document.getElementById("main-logo").src =
          IMAGE_CONFIG.restaurant.logoUrl;
        document.getElementById("restaurant-name").textContent =
          IMAGE_CONFIG.restaurant.name;
        document.getElementById("restaurant-tagline").textContent =
          IMAGE_CONFIG.restaurant.tagline;
        document.getElementById("about-text").textContent =
          IMAGE_CONFIG.restaurant.aboutText;
        document.getElementById("year").textContent = new Date().getFullYear();

        // 2. Set WhatsApp CTA Link
        /* ==========================================================================
       CENTRALIZED DATA CONFIGURATION
       ========================================================================== */
     // 2. Set WhatsApp Link
      const waUrl = `https://wa.me/${IMAGE_CONFIG.restaurant.whatsappNumber}?text=${encodeURIComponent(IMAGE_CONFIG.restaurant.whatsappMessage)}`;
      
      // ... rest of your IMAGE_CONFIG stays the same ...

        // 3. Render Carousel Items
        const track = document.getElementById("carousel-track");
        IMAGE_CONFIG.carouselImages.forEach((imgObj) => {
          const item = document.createElement("div");
          item.className = "carousel-item";
          item.innerHTML = `<img src="${imgObj.url}" alt="${imgObj.alt}">`;
          track.appendChild(item);
        });

        // Automated Carousel Logic: Shifts 3 images at a time every 7s
        let currentIndex = 0; // 0, 3, 6, 9
        const totalImages = IMAGE_CONFIG.carouselImages.length; // 12

        setInterval(() => {
          currentIndex = (currentIndex + 3) % totalImages;
          // On desktop each image takes 1/3 space + gap compensation
          // Transition shift percentage: (currentIndex / 3) * 100% of container length
          const shiftPercent = (currentIndex / 3) * 100;
          track.style.transform = `translateX(-${shiftPercent}%)`;
        }, 7000);

        // 4. Render Featured Meals Grid (3x3 Layout)
        const mealsGrid = document.getElementById("meals-grid");
        IMAGE_CONFIG.featuredMeals.forEach((meal) => {
          const card = document.createElement("article");
          card.className = "glass-card meal-card";
          card.innerHTML = `
          <div class="meal-img-wrapper">
            <img src="${meal.image}" alt="${meal.title}">
            <span class="price-badge">${meal.price}</span>
          </div>
          <div class="meal-details">
            <h3>${meal.title}</h3>
            <p>${meal.description}</p>
          </div>
        `;
          mealsGrid.appendChild(card);
        });
      });
    </script>
  </body>
</html>
